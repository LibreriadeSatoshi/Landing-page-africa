<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ISMOS mark: Ink on light browser chrome, Paper on dark -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-dark-16x16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Libreria de Satoshi · Africa Bitcoin Ambassador Program</title>
    <meta
      name="description"
      content="Join the Libreria de Satoshi Ambassador Program. Learn Bitcoin, teach your community, and shape Africa's financial future. Free, cohort-based Bitcoin education for young Africans (18–35)."
    />
    <meta
      name="keywords"
      content="Bitcoin, Africa, education, ambassador, blockchain, cryptocurrency, open source"
    />
    <meta name="author" content="Libreria de Satoshi" />

    <!-- Open Graph -->
    <meta property="og:title" content="Libreria de Satoshi · Africa Bitcoin Ambassador Program" />
    <meta
      property="og:description"
      content="A continent-wide program to learn Bitcoin and open-source technologies. Join young African leaders building technical fluency in Bitcoin."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libreriadesatoshi.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Libreria de Satoshi · Africa Bitcoin Ambassador Program" />
    <meta
      name="twitter:description"
      content="Learn Bitcoin. Teach your community. Shape Africa's future."
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#000000" />
  </head>
  <body class="ism-root">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
