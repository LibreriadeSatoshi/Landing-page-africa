[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# The Ambassador Africa program and its application form moved to ismos.xyz (2026-10-27):
# every address of this site, its API routes included, now sends visitors there. To bring the
# landing back, revert this rule and restore the two /api/ routes below it in git history.
[[redirects]]
  from = "/*"
  to = "https://ismos.xyz/en/programs/ambassador-africa/"
  status = 301
  force = true
